<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>游戏物品浏览器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#12141a;color:#e8eaf0;min-height:100vh}
header{padding:20px 24px;background:#1a1d26;border-bottom:1px solid #2a2e3a;position:sticky;top:0;z-index:10}
header h1{font-size:20px;color:#8ecff7}
header p{font-size:13px;color:#9aa4b4;margin-top:5px;line-height:1.5}
.search-bar{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;align-items:center}
.search-bar input{flex:1;min-width:260px;padding:10px 14px;border-radius:8px;border:1px solid #333a48;background:#212530;color:#e8eaf0;font-size:14px}
.search-bar input:focus{outline:none;border-color:#5a9fd4}
.count-badge{background:#2a2e3a;padding:8px 14px;border-radius:8px;font-size:13px;color:#aeb6c4}
main{display:flex;min-height:calc(100vh - 150px)}
aside{width:240px;padding:16px;border-right:1px solid #2a2e3a;background:#181b23;flex-shrink:0}
aside h3{font-size:13px;color:#8ecff7;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.cat-list{display:flex;flex-direction:column;gap:2px}
.cat-btn{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:#b8c0cc;cursor:pointer;font-size:13px;border:none;background:none;text-align:left;width:100%}
.cat-btn:hover{background:#232834;color:#fff}
.cat-btn.active{background:#2b4a6b;color:#8ecff7;font-weight:600}
.cat-btn .n{background:#2a2e3a;padding:2px 8px;border-radius:10px;font-size:11px;color:#8a92a0}
#grid{flex:1;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;align-content:start}
.card{background:#1c2029;border:1px solid #2a2e3a;border-radius:10px;padding:14px;cursor:pointer;transition:transform .1s,border-color .1s;min-width:0}
.card:hover{transform:translateY(-2px);border-color:#5a9fd4}
.card .nm{font-size:14px;font-weight:600;color:#eef2f8;overflow-wrap:anywhere}
.card .nm-en{font-size:12px;color:#8892a2;margin-top:2px;overflow-wrap:anywhere}
.card .cat{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.card .tag{font-size:10px;padding:2px 8px;border-radius:10px;background:#2a2e3a;color:#9aa4b4;overflow-wrap:anywhere}
.card .id{font-size:11px;color:#5c93c2;margin-top:8px;font-family:monospace;overflow-wrap:anywhere}
.card .desc{font-size:12px;color:#7a8290;margin-top:6px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.detail{position:fixed;right:20px;bottom:20px;max-width:420px;max-height:70vh;overflow:auto;background:#212530;border:1px solid #5a9fd4;border-radius:12px;padding:16px;box-shadow:0 8px 30px rgba(0,0,0,.5);display:none;z-index:20}
.detail.show{display:block}
.detail h2{font-size:16px;color:#fff;padding-right:26px;overflow-wrap:anywhere}
.detail .en{color:#8892a2;font-size:13px;margin:4px 0 10px;overflow-wrap:anywhere}
.detail .desc-full{font-size:13px;line-height:1.6;color:#b8c0cc;margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.detail .meta{font-size:12px;color:#8a92a0;display:grid;gap:6px;overflow-wrap:anywhere}
.detail .meta b{color:#8ecff7;font-weight:500;margin-right:5px}
#copyId{background:#2b4a6b;border:none;color:#8ecff7;padding:8px 16px;border-radius:8px;cursor:pointer;margin-top:12px;font-size:13px}
#copyId:hover{background:#345d85}
#closeDetail{position:absolute;top:10px;right:14px;background:none;border:none;color:#7a8290;font-size:18px;cursor:pointer}
.empty{grid-column:1/-1;text-align:center;color:#aeb6c4;padding:60px 20px;font-size:15px}
.server-status{display:flex;align-items:center;gap:8px;font-size:12px;color:#aeb6c4;margin-top:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#555;display:inline-block;flex-shrink:0}
.dot.on{background:#4caf50}.dot.off{background:#f44336}
.spawn-btn{background:#2b7a4b;border:none;color:#d9ffe8;padding:6px 14px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600}
.spawn-btn:hover{background:#33915c}
.spawn-btn:disabled{opacity:.7;cursor:wait}
.spawn-btn.done{background:#346b8b}.spawn-btn.err{background:#c62828}
.toast{position:fixed;top:20px;right:20px;max-width:min(480px,calc(100vw - 40px));background:#212530;border:1px solid #5a9fd4;color:#e8eaf0;padding:12px 18px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none;overflow-wrap:anywhere}
.toast.show{opacity:1}.toast.ok{border-color:#4caf50}.toast.bad{border-color:#f44336}
@media(max-width:700px){main{display:block}aside{width:auto;border-right:0;border-bottom:1px solid #2a2e3a}.cat-list{flex-direction:row;flex-wrap:wrap}.cat-btn{width:auto}#grid{grid-template-columns:1fr;padding:12px}.detail{left:12px;right:12px;bottom:12px;max-width:none}}
</style>
</head>
<body>
<header>
  <h1>游戏物品浏览器</h1>
  <p>目录由本地游戏资源提取并转换生成。请在部署时附上数据来源与授权说明；点击生成后会等待服务器状态确认，不把“已入队”当作“已生成”。</p>
  <div class="search-bar">
    <input type="text" id="search" placeholder="搜索名称 / ID / 描述...（支持中英）" autocomplete="off">
    <span class="count-badge" id="count">0 项</span>
  </div>
  <div class="server-status">
    <span class="dot off" id="svDot"></span>
    <span id="svText">检查生成服务器...</span>
  </div>
</header>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<main>
  <aside>
    <h3>分类</h3>
    <div class="cat-list" id="catList"></div>
  </aside>
  <div id="grid" aria-live="polite"></div>
</main>
<div class="detail" id="detail" role="dialog" aria-modal="false" aria-labelledby="dName">
  <button id="closeDetail" type="button" aria-label="关闭">×</button>
  <h2 id="dName"></h2>
  <div class="en" id="dEn"></div>
  <div class="desc-full" id="dDesc"></div>
  <div class="meta" id="dMeta"></div>
  <button id="copyId" type="button">复制 stableId</button>
</div>

<script src="items_data.js" onerror="window.ITEMS_DATA_LOAD_ERROR = true"></script>
<script>
(() => {
  "use strict";

  const grid = document.getElementById("grid");
  const search = document.getElementById("search");
  const catList = document.getElementById("catList");
  const detail = document.getElementById("detail");
  const toastNode = document.getElementById("toast");
  const API = "http://localhost:26880";
  const ITEMS = Array.isArray(window.ITEMS) ? window.ITEMS : [];
  let curCat = "ALL";
  let curSearch = "";
  let currentDetailId = "";

  function text(value) {
    if (value === null || value === undefined) return "";
    if (typeof value === "string") return value;
    if (typeof value === "number" || typeof value === "boolean") return String(value);
    try { return JSON.stringify(value); } catch (_) { return ""; }
  }

  function list(value) {
    if (Array.isArray(value)) return value.map(text).filter(Boolean);
    if (value === null || value === undefined || value === "") return [];
    return [text(value)];
  }

  function notify(message, kind) {
    toastNode.textContent = message;
    toastNode.className = "toast show " + (kind || "");
    window.clearTimeout(notify.timer);
    notify.timer = window.setTimeout(() => { toastNode.className = "toast"; }, 3200);
  }

  function makeNode(tag, className, value) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (value !== undefined) node.textContent = value;
    return node;
  }

  function categories(item) {
    return list(item && item.categories);
  }

  function categoryCounts() {
    const counts = new Map();
    ITEMS.forEach(item => categories(item).forEach(category => {
      counts.set(category, (counts.get(category) || 0) + 1);
    }));
    return counts;
  }

  function renderCats() {
    catList.replaceChildren();
    const counts = categoryCounts();
    const keys = ["ALL", ...Array.from(counts.keys()).sort((a, b) => a.localeCompare(b))];
    keys.forEach(key => {
      const button = makeNode("button", "cat-btn" + (curCat === key ? " active" : ""));
      button.type = "button";
      button.dataset.category = key;
      const label = makeNode("span", "", key === "ALL" ? "全部" : key);
      const count = makeNode("span", "n", String(key === "ALL" ? ITEMS.length : counts.get(key)));
      button.append(label, count);
      button.addEventListener("click", () => {
        curCat = key;
        renderCats();
        renderGrid();
      });
      catList.appendChild(button);
    });
  }

  function matches(item) {
    if (curCat !== "ALL" && !categories(item).includes(curCat)) return false;
    if (!curSearch) return true;
    const query = curSearch.toLocaleLowerCase();
    return [
      item && item.nameZh, item && item.nameEn, item && item.stableId,
      item && item.descriptionZh, item && item.descriptionEn
    ].map(text).some(value => value.toLocaleLowerCase().includes(query));
  }

  function renderGrid() {
    grid.replaceChildren();
    const filtered = ITEMS.filter(matches);
    document.getElementById("count").textContent = filtered.length + " 项";

    if (!filtered.length) {
      grid.appendChild(makeNode("div", "empty",
        ITEMS.length ? "无匹配物品" : "未加载物品目录。请先运行 extract_catalog.py 和 json_to_js.py。"));
      return;
    }

    filtered.forEach(item => {
      const id = text(item && item.stableId);
      if (!id) return;

      const card = makeNode("article", "card");
      card.tabIndex = 0;
      card.setAttribute("role", "button");
      card.setAttribute("aria-label", "查看物品 " + text(item.nameZh || id));
      card.addEventListener("click", () => showDetail(item));
      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          showDetail(item);
        }
      });

      card.appendChild(makeNode("div", "nm", text(item.nameZh || id)));
      card.appendChild(makeNode("div", "nm-en", text(item.nameEn)));
      const tagContainer = makeNode("div", "cat");
      categories(item).slice(0, 4).forEach(category => {
        tagContainer.appendChild(makeNode("span", "tag", category));
      });
      card.appendChild(tagContainer);
      card.appendChild(makeNode("div", "id", id));
      card.appendChild(makeNode("div", "desc", text(item.descriptionZh || item.descriptionEn)));

      const actionRow = makeNode("div");
      actionRow.style.marginTop = "10px";
      const spawnButton = makeNode("button", "spawn-btn", "生成 ×1");
      spawnButton.type = "button";
      spawnButton.dataset.itemId = id;
      spawnButton.addEventListener("click", event => {
        event.stopPropagation();
        spawnItem(id, spawnButton);
      });
      actionRow.appendChild(spawnButton);
      card.appendChild(actionRow);
      grid.appendChild(card);
    });
  }

  function appendMeta(label, value) {
    const row = makeNode("div");
    row.appendChild(makeNode("b", "", label));
    row.appendChild(document.createTextNode(text(value)));
    document.getElementById("dMeta").appendChild(row);
  }

  function showDetail(item) {
    currentDetailId = text(item && item.stableId);
    document.getElementById("dName").textContent = text(item && (item.nameZh || item.stableId));
    document.getElementById("dEn").textContent = text(item && item.nameEn);
    document.getElementById("dDesc").textContent = text(item && (item.descriptionZh || item.descriptionEn));
    const meta = document.getElementById("dMeta");
    meta.replaceChildren();
    appendMeta("stableId", currentDetailId);
    appendMeta("分类", categories(item).join(", "));
    appendMeta("itemTypes", list(item && item.itemTypes).join(", "));
    appendMeta("kind", item && item.kind);
    appendMeta("directory", item && item.directory);
    appendMeta("addPolicy", item && item.addPolicy);
    detail.classList.add("show");
  }

  document.getElementById("closeDetail").addEventListener("click", () => detail.classList.remove("show"));
  document.getElementById("copyId").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(currentDetailId);
      document.getElementById("copyId").textContent = "已复制 ✓";
    } catch (_) {
      notify("剪贴板不可用，请手动复制 stableId", "bad");
    }
    window.setTimeout(() => { document.getElementById("copyId").textContent = "复制 stableId"; }, 1300);
  });
  search.addEventListener("input", () => {
    curSearch = search.value.trim();
    renderGrid();
  });

  async function fetchJson(url) {
    const response = await fetch(url, { method: "GET", cache: "no-store" });
    let payload;
    try { payload = await response.json(); }
    catch (_) { throw new Error("服务器返回了无效 JSON (HTTP " + response.status + ")"); }
    if (!response.ok) throw new Error(text(payload.err || ("HTTP " + response.status)));
    return payload;
  }

  async function checkServer() {
    const dot = document.getElementById("svDot");
    const statusText = document.getElementById("svText");
    try {
      const health = await fetchJson(API + "/api/health");
      dot.className = "dot on";
      statusText.textContent = health.mode === "mock"
        ? "Mock 服务已连接（仅模拟，不会修改游戏背包）"
        : "游戏生成服务器已连接";
      return true;
    } catch (_) {
      dot.className = "dot off";
      statusText.textContent = "生成服务器离线 — 启动游戏模组或 mock 服务后重试";
      return false;
    }
  }

  async function waitForCompletion(requestId, button) {
    const deadline = Date.now() + 20000;
    while (Date.now() < deadline) {
      const status = await fetchJson(API + "/api/spawn/status?id=" + encodeURIComponent(requestId));
      if (status.state === "succeeded" || status.state === "failed" ||
          status.state === "partial" || status.state === "rejected") return status;
      button.textContent = status.state === "processing"
        ? "处理中 " + status.spawned + "/" + status.requested
        : "已入队，等待处理...";
      await new Promise(resolve => window.setTimeout(resolve, 400));
    }
    return null;
  }

  async function spawnItem(id, button) {
    if (button.disabled) return;
    button.disabled = true;
    button.className = "spawn-btn";
    button.textContent = "发送请求...";
    try {
      if (!(await checkServer())) throw new Error("服务器离线");
      const accepted = await fetchJson(API + "/api/spawn?itemId=" + encodeURIComponent(id) + "&count=1");
      if (!accepted.requestId || accepted.state !== "queued") {
        throw new Error("服务器未确认请求入队");
      }
      button.textContent = "已入队，等待处理...";
      notify("请求已接收并入队；正在等待主线程处理。", "");
      const result = await waitForCompletion(accepted.requestId, button);
      if (!result) {
        button.className = "spawn-btn";
        button.textContent = "仍在处理中";
        notify("请求仍在队列或处理中，尚未确认生成结果。请求 ID: " + accepted.requestId, "");
        return;
      }
      if (result.state === "succeeded" && result.mode === "mock") {
        button.className = "spawn-btn done";
        button.textContent = "Mock 模拟完成";
        notify("Mock 模拟完成：没有调用游戏 API，也没有修改游戏背包。", "ok");
      } else if (result.state === "succeeded") {
        button.className = "spawn-btn done";
        button.textContent = "已生成 ✓";
        notify("游戏服务器已确认生成 " + result.spawned + "/" + result.requested, "ok");
      } else {
        button.className = "spawn-btn err";
        button.textContent = result.state === "partial" ? "部分完成" : "生成失败";
        notify("生成状态: " + result.state + "；已完成 " + result.spawned + "/" + result.requested +
          (result.err ? "；" + result.err : ""), "bad");
      }
    } catch (error) {
      button.className = "spawn-btn err";
      button.textContent = "请求失败";
      notify("生成请求失败: " + text(error && error.message || error), "bad");
    } finally {
      window.setTimeout(() => {
        button.className = "spawn-btn";
        button.textContent = "生成 ×1";
        button.disabled = false;
      }, 3200);
    }
  }

  if (!Array.isArray(window.ITEMS)) {
    const message = window.ITEMS_DATA_LOAD_ERROR
      ? "items_data.js 加载失败。请确认该文件与 items_browser.html 位于同一目录。"
      : "物品目录格式无效。请使用 json_to_js.py 重新生成 items_data.js。";
    grid.appendChild(makeNode("div", "empty", message));
  }

  renderCats();
  renderGrid();
  checkServer();
  window.setInterval(checkServer, 5000);
})();
</script>
</body>
</html>
