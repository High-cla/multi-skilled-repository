name: Repository regression

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - fix/item-spawner-reliability-and-skill-consistency
  pull_request:

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      windows: ${{ steps.filter.outputs.windows }}
      agent: ${{ steps.filter.outputs.agent }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Classify changed paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
          else
            base_sha="$BEFORE_SHA"
          fi

          force_all=false
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            changed_files="$(git ls-tree -r --name-only "$HEAD_SHA")"
          else
            if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
              if ! git fetch --no-tags --depth=1 origin "$base_sha"; then
                echo "::warning::Could not fetch the comparison base; running all test jobs."
                force_all=true
              fi
            fi

            if [[ "$force_all" == "true" ]]; then
              changed_files="$(git ls-tree -r --name-only "$HEAD_SHA")"
            else
              changed_files="$(git diff --name-only "$base_sha" "$HEAD_SHA")"
            fi
          fi

          python_changed=false
          windows_changed=false
          agent_changed=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            case "$file" in
              .github/workflows/*)
                python_changed=true
                windows_changed=true
                agent_changed=true
                ;;
              skills/cli-first-decision/*|skills/customize-dsh/*|requirements-agent-skill-validation.txt)
                agent_changed=true
                ;;
              skills/game-item-spawner/scripts/*.py|skills/game-item-spawner/tests/*)
                python_changed=true
                ;;
              skills/game-item-spawner/scripts/spawn_server.cs|skills/cmd-powershell-pitfalls/*)
                windows_changed=true
                ;;
            esac
          done <<< "$changed_files"

          {
            echo "python=$python_changed"
            echo "windows=$windows_changed"
            echo "agent=$agent_changed"
          } >> "$GITHUB_OUTPUT"

          echo "Changed files:"
          printf '%s\n' "$changed_files"
          echo "Selected jobs: python=$python_changed windows=$windows_changed agent=$agent_changed"

  python-ubuntu:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile Python scripts
        run: |
          python -m py_compile skills/game-item-spawner/scripts/extract_catalog.py
          python -m py_compile skills/game-item-spawner/scripts/json_to_js.py
          python -m py_compile skills/game-item-spawner/scripts/mock_spawn_server.py
      - name: Run game item spawner tests
        run: python -m unittest discover -s skills/game-item-spawner/tests -v

  python-windows:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Compile and test Python tooling
        shell: pwsh
        run: |
          python -m py_compile skills/game-item-spawner/scripts/extract_catalog.py
          python -m py_compile skills/game-item-spawner/scripts/json_to_js.py
          python -m py_compile skills/game-item-spawner/scripts/mock_spawn_server.py
          python -m unittest discover -s skills/game-item-spawner/tests -v

  agent-skill-validation:
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent-skill-validation.txt
      - name: Install pinned Agent Skills reference validator
        run: python -m pip install -r requirements-agent-skill-validation.txt
      - name: Validate cli-first-decision and customize-dsh skills
        run: |
          skills-ref validate skills/cli-first-decision
          skills-ref validate skills/customize-dsh
      - name: Validate declarative eval dataset structure
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("skills/cli-first-decision/evals/evals.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data.get("skill") == "cli-first-decision", "unexpected skill name"

          skill_text = Path("skills/cli-first-decision/SKILL.md").read_text(encoding="utf-8")
          frontmatter_match = re.match(
              r"\A---\s*\n(.*?)\n---(?:\s*\n|\Z)",
              skill_text,
              flags=re.DOTALL,
          )
          assert frontmatter_match is not None, "SKILL.md frontmatter is missing or malformed"

          metadata_match = re.search(
              r"(?m)^metadata:\s*\n((?:[ \t]+[^\r\n]*(?:\r?\n|$))*)",
              frontmatter_match.group(1),
          )
          assert metadata_match is not None, "SKILL.md metadata mapping is missing"

          version_match = re.search(
              r"""(?m)^  version:\s*(?:"([^"]+)"|'([^']+)'|([^#\s]+))\s*(?:#.*)?$""",
              metadata_match.group(1),
          )
          assert version_match is not None, "SKILL.md metadata.version is missing or invalid"
          skill_version = next(value for value in version_match.groups() if value is not None)

          eval_version = data.get("version")
          assert isinstance(eval_version, str) and eval_version, "eval version must be a non-empty string"
          assert eval_version == skill_version, (
              f"eval version {eval_version!r} does not match "
              f"SKILL.md metadata.version {skill_version!r}"
          )

          cases = data.get("cases")
          assert isinstance(cases, list) and cases, "cases must be a non-empty list"

          ids = []
          for index, case in enumerate(cases):
              assert isinstance(case, dict), f"case {index} must be an object"
              case_id = case.get("id")
              assert isinstance(case_id, str) and re.fullmatch(r"E[0-9]{2,}", case_id), f"invalid id at case {index}"
              assert isinstance(case.get("input"), str) and case["input"].strip(), f"{case_id}: input must be non-empty"
              expected = case.get("expected")
              assert isinstance(expected, list) and expected, f"{case_id}: expected must be a non-empty list"
              assert all(isinstance(item, str) and item.strip() for item in expected), f"{case_id}: expected items must be non-empty strings"
              ids.append(case_id)

          assert len(ids) == len(set(ids)), "case IDs must be unique"
          print(f"Validated {len(cases)} cli-first-decision eval case definitions.")

          # customize-dsh uses its own declarative schema: skill_name + evals[].
          customize_path = Path("skills/customize-dsh/evals/evals.json")
          customize_data = json.loads(customize_path.read_text(encoding="utf-8"))
          assert isinstance(customize_data, dict), "customize-dsh eval dataset must be an object"
          assert customize_data.get("skill_name") == "customize-dsh", "unexpected customize-dsh skill_name"

          customize_evals = customize_data.get("evals")
          assert isinstance(customize_evals, list) and customize_evals, (
              "customize-dsh evals must be a non-empty list"
          )

          customize_ids = []
          customize_names = []
          for index, evaluation in enumerate(customize_evals):
              assert isinstance(evaluation, dict), f"customize-dsh eval {index} must be an object"

              eval_id = evaluation.get("id")
              assert isinstance(eval_id, int) and not isinstance(eval_id, bool) and eval_id > 0, (
                  f"customize-dsh eval {index}: id must be a positive integer"
              )

              name = evaluation.get("name")
              assert isinstance(name, str) and re.fullmatch(r"[a-z0-9]+(?:-[a-z0-9]+)*", name), (
                  f"customize-dsh eval {eval_id}: name must be a non-empty kebab-case identifier"
              )

              prompt = evaluation.get("prompt")
              assert isinstance(prompt, str) and prompt.strip(), (
                  f"customize-dsh eval {eval_id}: prompt must be non-empty"
              )

              assertions = evaluation.get("assertions")
              assert isinstance(assertions, list) and assertions, (
                  f"customize-dsh eval {eval_id}: assertions must be a non-empty list"
              )
              assert all(isinstance(item, str) and item.strip() for item in assertions), (
                  f"customize-dsh eval {eval_id}: assertions must contain non-empty strings"
              )

              customize_ids.append(eval_id)
              customize_names.append(name)

          assert len(customize_ids) == len(set(customize_ids)), (
              "customize-dsh eval IDs must be unique"
          )
          assert len(customize_names) == len(set(customize_names)), (
              "customize-dsh eval names must be unique"
          )

          print(
              f"Validated {len(customize_evals)} customize-dsh eval definitions; "
              "these checks dataset structure, not model behavior."
          )
          PY

  windows-shell-regression:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CMD parser, delayed expansion, literal bang, and exit-code smoke
        shell: cmd
        run: call skills\cmd-powershell-pitfalls\tests\cmd-runtime-smoke.cmd
      - name: Windows PowerShell 5.1 smoke
        shell: powershell
        run: .\skills\cmd-powershell-pitfalls\tests\powershell-runtime-smoke.ps1 -ExpectedMajor 5
      - name: PowerShell 7+ smoke
        shell: pwsh
        run: .\skills\cmd-powershell-pitfalls\tests\powershell-runtime-smoke.ps1 -ExpectedMajor 7
      - name: Compile C# localhost server template (.NET Framework)
        shell: powershell
        run: |
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Compiler not found: $compiler" }
          & $compiler /nologo /target:library /r:System.dll /r:System.Core.dll /r:System.Web.dll /out:"$env:RUNNER_TEMP\SpawnServerTemplate.dll" skills\game-item-spawner\scripts\spawn_server.cs
          if ($LASTEXITCODE -ne 0) { throw "C# compilation failed: $LASTEXITCODE" }
